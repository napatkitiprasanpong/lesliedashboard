<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leslie Project Dashboard</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--glass:rgba(22,22,28,.62);--line:rgba(255,255,255,.09);--tx:#f5f5f7;--mut:#9a9aa6;--red:#e11d2e;--red2:#ff4757;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html{margin:0;background:#000}body{margin:0;background:transparent;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;background:#000}
#load{position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}#load.x{opacity:0;pointer-events:none}#lb{display:flex;gap:8px}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.1);border-top-color:var(--red2);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pv{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}.pv iframe{flex:1;border:0;background:#222}.pvh{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px}a.ghost{text-decoration:none;display:inline-block}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ring{from{stroke-dashoffset:327}}
@keyframes pop{50%{transform:scale(1.35)}}
@keyframes grow{from{width:0}}
aside{position:fixed;left:0;top:0;bottom:0;width:236px;padding:calc(24px + env(safe-area-inset-top,0px)) 14px 20px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;z-index:5}
.brand{padding:0 10px 22px;font-weight:800;font-size:20px;letter-spacing:-.5px;line-height:1.1}
.brand span{display:block;color:var(--mut);font-size:12px;font-weight:500;letter-spacing:0;margin-top:4px}
.brand b{color:var(--red2)}
aside button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:11px 12px;border-radius:12px;cursor:pointer;position:relative;text-align:left;transition:color .2s,background .25s,transform .2s}
aside button em{font-style:normal;width:22px;text-align:center;font-size:17px;transition:transform .25s}
aside button:hover{color:var(--tx);background:rgba(255,255,255,.05);transform:translateX(4px)}
aside button:hover em{transform:scale(1.25) rotate(-6deg)}
aside button.on{color:#fff;background:linear-gradient(90deg,rgba(225,29,46,.55),rgba(225,29,46,.08));box-shadow:inset 3px 0 var(--red2)}
main{margin-left:236px;padding:32px 28px 60px;max-width:1000px}
.pt{font-size:30px;margin:0 0 18px;font-weight:800;letter-spacing:-1px}
.hero h1{font-size:clamp(30px,5vw,46px);margin:0;letter-spacing:-1.5px;line-height:1.05;font-weight:800;background:linear-gradient(90deg,#fff,#ff4757);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);margin:6px 0 22px}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
.card,.row,.pc,.st{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.st{padding:16px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.st:hover{transform:translateY(-5px);border-color:var(--red);box-shadow:0 12px 30px -10px rgba(225,29,46,.6)}
.st small{color:var(--mut);display:block}.st strong{font-size:28px;letter-spacing:-1px}
.card{padding:18px}.card h3{margin:0 0 10px;font-size:16px}
.ringbox{display:flex;align-items:center;gap:18px}
.ring{width:110px;height:110px;flex:none}.ring circle{fill:none;stroke-width:10}
.ring .a{stroke:rgba(255,255,255,.08)}.ring .b{stroke:var(--red2);stroke-linecap:round;stroke-dasharray:327;animation:ring 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select{background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--tx);padding:11px 13px;border-radius:12px;font:inherit;min-width:0;flex:1 1 130px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--red2);box-shadow:0 0 0 3px rgba(225,29,46,.25);outline:0}
.btn{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:0;padding:11px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px -6px rgba(255,71,87,.7)}.btn:active{transform:scale(.96)}
.ghost{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 11px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;transition:.2s}
.ghost:hover{color:#fff;border-color:var(--red2);background:rgba(225,29,46,.2)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;transition:transform .2s,border-color .2s}
.row:hover{transform:translateX(4px);border-color:rgba(255,71,87,.5)}
.row .g{flex:1;min-width:0;overflow-wrap:anywhere}.row.done .g{text-decoration:line-through;color:var(--mut)}
.row input[type=checkbox]{flex:none;accent-color:var(--red);width:20px;height:20px;flex:0 0 20px}.row input:checked{animation:pop .3s}
.mut{color:var(--mut);font-size:13px}.in{color:#3ddc84}.out{color:var(--red2)}
.empty{color:var(--mut);padding:28px;text-align:center;border:1px dashed var(--line);border-radius:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.cal .h{color:var(--mut);font-size:12px;text-align:center}
.d{background:var(--glass);border:1px solid var(--line);border-radius:10px;aspect-ratio:1;color:var(--tx);cursor:pointer;font:inherit;position:relative;transition:transform .2s,background .2s}
.d:hover{transform:scale(1.12);border-color:var(--red2)}.d.t{color:var(--red2);font-weight:800}.d.s{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.d .dt{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}.d i{width:6px;height:6px;border-radius:50%;background:#fff}.d i.e{background:var(--red2);box-shadow:0 0 0 1.5px #fff}
.bar{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin:8px 0 16px}.bar div{height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:6px;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pc{overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s}
.pc:hover{transform:translateY(-6px);border-color:var(--red2);box-shadow:0 18px 40px -14px rgba(225,29,46,.7)}
.pc a{display:block;color:inherit;text-decoration:none}
.th{aspect-ratio:16/9;background:linear-gradient(135deg,var(--red),#2a0004);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.pc:hover .th img{transform:scale(1.08)}
.pb{padding:12px 14px}.pb b{display:block;overflow-wrap:anywhere}
.pa{display:flex;gap:6px;padding:0 14px 14px;flex-wrap:wrap}
.foot{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
@media(max-width:760px){
 aside{top:auto;width:100%;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);justify-content:space-around;gap:0}
 .brand{display:none}
 aside button{flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;flex:1;text-align:center;justify-content:center}
 aside button:hover{transform:none}aside button.on{box-shadow:inset 0 3px var(--red2)}
 main{margin:0;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 100px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="load"><div class="spin"></div><p id="lt">Syncing with GitHub...</p><div id="lb"></div></div>
<aside id="nav"></aside>
<main id="view"></main>
<input type="file" id="pic" accept="image/*" hidden>
<script>
const TABS=[["Dashboard","⌂"],["Task","✓"],["Calendar","▦"],["Event","★"],["Money","$"],["Calories","♥"],["Project","❖"],["File","▤"]];
const NAMES=TABS.map(t=>t[0]);
const COLS=["tasks","events","money","food","projects","folders","files"];
const S={tasks:[],events:[],money:[],food:[],projects:[],folders:[],files:[],dead:{},gu:0,goal:2000};
try{Object.assign(S,JSON.parse(localStorage.getItem("lpd")||"{}"))}catch(e){}
const ghCfg=()=>{try{return JSON.parse(localStorage.getItem("lpd-gh"))}catch(e){return null}};
const GH=()=>{const c=ghCfg();return c&&c.token&&c.repo?c:null};
const br=c=>"?ref="+encodeURIComponent(c.branch||"main");
const NAT={has:async()=>!!GH(),read:()=>ghRead(),write:s=>ghWrite(s)};
let ghSha=null;
async function ghFetch(path,o={}){const c=GH();if(!c)throw new Error("GitHub not connected");const r=await fetch("https://api.github.com/repos/"+c.repo+path+(o.q||""),{method:o.method||"GET",cache:"no-store",headers:{Authorization:"Bearer "+c.token,Accept:o.raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:o.body?JSON.stringify(o.body):undefined});if(!r.ok&&!(o.ok404&&r.status===404)){const e=new Error("GitHub "+r.status);e.status=r.status;throw e}return r}
async function ghRead(){const c=GH(),r=await ghFetch("/contents/leslie-data.json",{q:br(c),ok404:true});if(r.status===404){ghSha=null;return null}const j=await r.json();ghSha=j.sha;if(j.content)return decodeURIComponent(escape(atob(j.content.replace(/\s/g,""))));return(await ghFetch("/contents/leslie-data.json",{q:br(c),raw:true})).text()}
async function ghWrite(t){const c=GH();try{const r=await ghFetch("/contents/leslie-data.json",{method:"PUT",body:{message:"sync "+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(t))),branch:c.branch||"main",...(ghSha?{sha:ghSha}:{})}});ghSha=(await r.json()).content.sha;return true}catch(e){if(e.status===409||e.status===422)setTimeout(sync,1500);throw e}}
async function ghPut(path,file){const c=GH(),b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file)});await ghFetch("/contents/"+path,{method:"PUT",body:{message:"add "+path,content:b64,branch:c.branch||"main"}})}
async function ghDel(path){const c=GH(),r=await ghFetch("/contents/"+path,{q:br(c),ok404:true});if(r.status===404)return;const j=await r.json();await ghFetch("/contents/"+path,{method:"DELETE",body:{message:"delete "+path,sha:j.sha,branch:c.branch||"main"}})}
async function ghConnect(v){const cfg={repo:v.r.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,""),token:v.t.trim(),branch:(v.b||"main").trim()};localStorage.setItem("lpd-gh",JSON.stringify(cfg));try{await ghFetch("");await sync(true);render()}catch(e){localStorage.removeItem("lpd-gh");alert(e.status===404?"Repo not found. Check the name and that the token can access it.":e.status===401?"GitHub rejected the token.":"Could not connect: "+e.message)}}
function ghCard(){const c=GH();return `<div class="card" style="margin:12px 0"><h3>GitHub sync</h3>`+(c?`<div class="mut">Connected to <b>${esc(c.repo)}</b> (${esc(c.branch||"main")}). <span id="ss">${esc(SS)}</span></div><div class="foot"><button class="ghost" data-a="sync">Sync now</button><button class="ghost" data-a="ghoff">Disconnect</button></div>`:`<form data-f="gh"><input name="r" placeholder="username/your-data-repo" required><input name="t" type="password" placeholder="Access token" required><input name="b" placeholder="Branch (main)" style="flex:0 1 120px"><button class="btn">Connect</button></form><div class="mut">Use a private repo and a token with Contents read and write. See README.</div>`)+`</div>`}
const ghp=f=>"files/"+String(f.id).replace(/\W/g,"_")+".pdf";
async function getPdf(f){if(f.gh){const c=GH();if(!c)throw 0;return(await ghFetch("/contents/"+ghp(f),{q:br(c),raw:true})).blob()}return fget(String(f.id))}
async function dlPdf(i){const f=S.files.find(x=>x.id===i),b=await getPdf(f).catch(()=>null);if(!b)return alert("Could not get this PDF. Check your GitHub connection.");const u=URL.createObjectURL(new Blob([b],{type:"application/pdf"})),a=document.createElement("a");a.href=u;a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
let H={},pt,SS="Not synced yet";
const hs=it=>JSON.stringify({...it,u:0});
function rebuild(){H={goal:S.goal};for(const k of COLS)for(const it of S[k])H[String(it.id)]=hs(it)}
function stamp(){const now=Date.now(),seen=new Set();for(const k of COLS)for(const it of S[k]){const i=String(it.id);seen.add(i);if(H[i]!==hs(it)){it.u=now;H[i]=hs(it)}}for(const i in H)if(i!=="goal"&&!seen.has(i)){S.dead[i]=now;delete H[i]}if(H.goal!==S.goal){S.gu=now;H.goal=S.goal}}
function merge(a,b){const d={...a.dead},o={...a,dead:d};for(const i in b.dead||{})d[i]=Math.max(d[i]||0,b.dead[i]);for(const k of COLS){const m=new Map();for(const it of[...(a[k]||[]),...(b[k]||[])]){const p=m.get(String(it.id));if(!p||(it.u||0)>(p.u||0))m.set(String(it.id),it)}o[k]=[...m.values()].filter(it=>!(d[String(it.id)]>=(it.u||0)))}if((b.gu||0)>(a.gu||0)){o.goal=b.goal;o.gu=b.gu}return o}
const norm=o=>JSON.stringify([COLS.map(k=>(o[k]||[]).map(i=>i.id+":"+i.u).sort()),o.goal,o.gu||0,Object.entries(o.dead||{}).sort()]);
const locSave=()=>{try{localStorage.setItem("lpd",JSON.stringify(S))}catch(e){}};
const save=()=>{stamp();locSave();if(NAT){clearTimeout(pt);pt=setTimeout(()=>sync(),1500)}};
COLS.forEach(k=>S[k].forEach(it=>{if(!it.u)it.u=1}));rebuild();
let sq=Promise.resolve();function sync(m){return sq=sq.then(()=>doSync(m),()=>doSync(m))}
async function doSync(manual){if(!NAT)return false;try{if(!await NAT.has()){SS="GitHub not connected";return false}const t=await NAT.read(),remote=t?JSON.parse(t):null,m=remote?merge(S,remote):S,ch=norm(m)!==norm(S);if(ch){Object.assign(S,m);rebuild();locSave()}if(!remote||norm(remote)!==norm(m))await NAT.write(JSON.stringify(S));SS="Synced "+new Date().toLocaleTimeString();const s=$("#ss");if(s)s.textContent=SS;if(ch)render();return true}catch(e){SS="Sync failed";const s=$("#ss");if(s)s.textContent=SS;return false}}
async function pickSync(){if(await NAT.pick())await sync(true)}

async function boot(){const L=$("#load");if(!GH()){L.remove();return}await Promise.race([sync(),new Promise(r=>setTimeout(r,8000))]);L.classList.add("x");setTimeout(()=>L.remove(),500);render(true)}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=iso(new Date());
let tab="Dashboard";try{const h=decodeURIComponent(location.hash.slice(1));if(NAMES.includes(h))tab=h}catch(e){}
let cm=new Date();cm.setDate(1);let sel=today,picFor=null,cwd=null,openP=null;
const money=n=>(n<0?"-":"")+"$"+Math.abs(n).toFixed(2);
const id=()=>Date.now()+Math.random();
const empty=t=>`<div class="empty">${t}</div>`;
const pj=i=>i&&S.projects.find(p=>p.id===i);
const TF=p=>`<form data-f="task">${p?`<input type="hidden" name="p" value="${p}">`:""}<input name="t" placeholder="New task" required><input name="d" type="date" value="${today}" aria-label="Deadline"><label class="ghost" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="nd" style="flex:none;width:16px;height:16px;padding:0;accent-color:var(--red)">No deadline</label><button class="btn">Add task</button></form>`;
const TR=t=>`<div class="row ${t.done?"done":""}"><input type="checkbox" data-a="tg" data-i="${t.id}" ${t.done?"checked":""} aria-label="Done"><div class="g">${esc(t.t)} ${t.due?`<button class="ghost" data-a="goto" data-k="${t.due}">${t.due}</button>`:'<span class="mut">No deadline</span>'}</div><button class="ghost" data-a="del" data-k="tasks" data-i="${t.id}">Delete</button></div>`;
function projDetail(){const p=pj(openP),l=S.tasks.filter(t=>t.pid===p.id).sort((a,b)=>a.done-b.done||(a.due||"9").localeCompare(b.due||"9"));return `<div class="row"><button class="ghost" data-a="pback">Back</button><div class="g"><b>${esc(p.title)}</b> <span class="mut">${esc(p.owner)}/${esc(p.name)}</span></div><a class="ghost" href="${esc(p.url)}" target="_blank" rel="noopener">GitHub</a></div>${TF(p.id)}`+(l.length?l.map(TR).join(""):empty("No tasks for this project yet."))}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("lpd-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fput=async(k,b)=>{const d=await idb();return new Promise(r=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(b,k);t.oncomplete=()=>r()})};
const fget=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction("f").objectStore("f").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const fdel=async k=>{try{const d=await idb();d.transaction("f","readwrite").objectStore("f").delete(k)}catch(e){}};
async function upload(e){for(const f of e.target.files){if(f.size>25e6){alert(f.name+" is over 25 MB");continue}const i=id(),it={id:i,name:f.name,size:f.size,folder:cwd};if(GH()){try{it.gh=1;await ghPut(ghp(it),f)}catch(x){alert("Upload failed: "+x.message);continue}}else await fput(String(i),f);S.files.push(it)}e.target.value="";save();render()}
async function openPdf(i){const f=S.files.find(x=>x.id===i),b=await getPdf(f).catch(()=>null);if(!b)return alert("This PDF is not on this device. Open it on the device where you added it.");const u=URL.createObjectURL(new Blob([b],{type:"application/pdf"})),v=document.createElement("div");v.className="pv";v.innerHTML=`<div class="pvh"><b>${esc(f.name)}</b><span><a class="ghost" download="${esc(f.name)}" href="${u}">Download</a> <button class="ghost" id="pvx">Close</button></span></div><iframe src="${u}"></iframe>`;document.body.append(v);$("#pvx").onclick=()=>{v.remove();URL.revokeObjectURL(u)}}
function repoInfo(v){
  v=v.trim().replace(/\.git$/,"").replace(/\/$/,"");
  const m=v.match(/github\.com\/([\w.-]+)\/([\w.-]+)/)||v.match(/^([\w.-]+)\/([\w.-]+)$/);
  return m?{owner:m[1],name:m[2],url:"https://github.com/"+m[1]+"/"+m[2]}:null;
}
const bal=()=>S.money.reduce((a,m)=>a+(m.type==="in"?m.amt:-m.amt),0);
const kcal=()=>S.food.filter(f=>f.date===today).reduce((a,f)=>a+f.kcal,0);
const thumb=p=>p.img?`<img src="${p.img}" alt="">`:esc(p.title[0].toUpperCase());

const V={
Dashboard(){
  const h=new Date().getHours(),gr=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const kc=kcal(),p=Math.min(1,kc/S.goal),open=S.tasks.filter(t=>!t.done);
  const ag=[...S.events.filter(e=>e.date===today).map(e=>"★ "+esc(e.t)+(e.allday?" (all day)":e.time?" at "+e.time:"")),...open.filter(t=>t.due&&t.due<=today).map(t=>"✓ "+esc(t.t)+(t.due<today?" (overdue)":""))];
  return `<div class="hero"><h1>${gr}, Leslie</h1><p>${new Date().toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</p></div>
  <div class="g2">
   <div class="st" data-tab="Task"><small>Open tasks</small><strong>${open.length}</strong></div>
   <div class="st" data-tab="Event"><small>Upcoming events</small><strong>${S.events.filter(e=>e.date>=today).length}</strong></div>
   <div class="st" data-tab="Money"><small>Balance</small><strong>${money(bal())}</strong></div>
   <div class="st" data-tab="Project"><small>Projects</small><strong>${S.projects.length}</strong></div>
  </div>
  <div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
   <div class="card"><h3>Today</h3>${ag.length?ag.map(a=>`<div class="mut" style="padding:4px 0;font-size:15px;color:var(--tx)">${a}</div>`).join(""):'<div class="mut">Nothing due today. Enjoy it.</div>'}</div>
   <div class="card"><h3>Calories</h3><div class="ringbox"><svg class="ring" viewBox="0 0 120 120"><circle class="a" cx="60" cy="60" r="52"/><circle class="b" cx="60" cy="60" r="52" transform="rotate(-90 60 60)" style="stroke-dashoffset:${327*(1-p)}"/></svg><div><strong style="font-size:26px">${kc}</strong><div class="mut">of ${S.goal} kcal today</div></div></div></div>
  </div>
  <div class="card"><h3>Recent projects</h3>${S.projects.length?`<div class="grid">${S.projects.slice(-3).reverse().map(p=>`<div class="pc"><a href="${esc(p.url)}" target="_blank" rel="noopener"><div class="th">${thumb(p)}</div><div class="pb"><b>${esc(p.title)}</b><span class="mut">${esc(p.owner)}/${esc(p.name)}</span></div></a></div>`).join("")}</div>`:'<div class="mut">No projects yet. Add a GitHub repo in the Project tab.</div>'}</div>
  ${ghCard()}<div class="foot"><button class="ghost" data-a="exp">Export backup</button><label class="ghost" style="cursor:pointer">Import backup<input type="file" id="imp" accept=".json" hidden></label></div>`;
},
Task(){
  const l=[...S.tasks].sort((a,b)=>a.done-b.done||(a.due||"9").localeCompare(b.due||"9"));
  return `${TF()}`+
  (l.length?l.map(t=>`<div class="row ${t.done?"done":""}"><input type="checkbox" data-a="tg" data-i="${t.id}" ${t.done?"checked":""} aria-label="Done"><div class="g">${esc(t.t)}${t.due?` <button class="ghost" data-a="goto" data-k="${t.due}" title="Show on calendar">${t.due}</button>`:' <span class="mut">No deadline</span>'}${pj(t.pid)?` <span class="mut">in ${esc(pj(t.pid).title)}</span>`:""}</div><button class="ghost" data-a="del" data-k="tasks" data-i="${t.id}">Delete</button></div>`).join(""):empty("No tasks yet. Add your first one above."));
},
Calendar(){
  const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  const evs=new Set(S.events.map(e=>e.date)),tks=new Set(S.tasks.filter(t=>t.due&&!t.done).map(t=>t.due));
  let c=["S","M","T","W","T","F","S"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(first);
  for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d));c+=`<button class="d ${k===today?"t":""} ${k===sel?"s":""}" data-a="day" data-k="${k}">${d}<span class="dt">${evs.has(k)?'<i class="e"></i>':""}${tks.has(k)?"<i></i>":""}</span></button>`}
  const items=[...S.events.filter(e=>e.date===sel).map(e=>`<div class="row"><span class="out">★</span><div class="g"><b>${esc(e.t)}</b>${e.allday?' <span class="mut">All day</span>':e.time?` <span class="mut">${e.time}</span>`:""}</div><button class="ghost" data-a="del" data-k="events" data-i="${e.id}">Delete</button></div>`),...S.tasks.filter(t=>t.due===sel).map(t=>`<div class="row ${t.done?"done":""}"><input type="checkbox" data-a="tg" data-i="${t.id}" ${t.done?"checked":""} aria-label="Done"><div class="g">${esc(t.t)}</div><button class="ghost" data-a="del" data-k="tasks" data-i="${t.id}">Delete</button></div>`)];
  return `<div class="row"><button class="ghost" data-a="mo" data-k="-1">Prev</button><div class="g" style="text-align:center;font-weight:700">${cm.toLocaleString("en",{month:"long",year:"numeric"})}</div><button class="ghost" data-a="mo" data-k="1">Next</button></div><div class="cal">${c}</div><p class="mut">Red dot: event. White dot: task.</p><h3>${sel}</h3><form data-f="cal"><select name="ty"><option value="task">Task</option><option value="event">Event</option></select><input name="t" placeholder="Add to this day" required><input name="tm" type="time" aria-label="Time (events)"><label class="ghost" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="ad" style="flex:none;width:16px;height:16px;padding:0;accent-color:var(--red)">All day</label><button class="btn">Add</button></form>`+
  (items.length?items.join(""):empty("Nothing planned for this day."));
},
Event(){
  const l=[...S.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  return `<form data-f="event"><input name="t" placeholder="Event name" required><input name="d" type="date" value="${today}" required><input name="tm" type="time"><label class="ghost" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="ad" style="flex:none;width:16px;height:16px;padding:0;accent-color:var(--red)">All day</label><button class="btn">Add event</button></form>`+
  (l.length?l.map(e=>`<div class="row"><div class="g"><b>${esc(e.t)}</b><div class="mut"><button class="ghost" data-a="goto" data-k="${e.date}" title="Show on calendar">${e.date}</button>${e.allday?" (all day)":e.time?" at "+e.time:""}${e.date<today?" (past)":""}</div></div><button class="ghost" data-a="del" data-k="events" data-i="${e.id}">Delete</button></div>`).join(""):empty("No events yet."));
},
Money(){
  const inc=S.money.filter(m=>m.type==="in").reduce((a,m)=>a+m.amt,0),out=S.money.filter(m=>m.type==="out").reduce((a,m)=>a+m.amt,0);
  return `<form data-f="money"><select name="ty"><option value="out">Expense</option><option value="in">Income</option></select><input name="n" placeholder="What for?" required><input name="a" type="number" step="0.01" min="0" placeholder="Amount" required><button class="btn">Add</button></form>
  <div class="g2"><div class="st"><small>Income</small><strong class="in">${money(inc)}</strong></div><div class="st"><small>Spent</small><strong class="out">${money(out)}</strong></div><div class="st"><small>Balance</small><strong>${money(inc-out)}</strong></div></div>`+
  (S.money.length?[...S.money].reverse().map(m=>`<div class="row"><div class="g">${esc(m.n)} <span class="mut">${m.date}</span></div><b class="${m.type}">${m.type==="in"?"+":"-"}${money(m.amt)}</b><button class="ghost" data-a="del" data-k="money" data-i="${m.id}">Delete</button></div>`).join(""):empty("No transactions yet."));
},
Calories(){
  const l=S.food.filter(f=>f.date===today),kc=kcal(),p=Math.min(100,kc/S.goal*100);
  return `<form data-f="food"><input name="n" placeholder="Food or drink" required><input name="q" type="number" min="0.1" step="0.1" value="1" aria-label="Amount (servings)" placeholder="Amount" style="flex:0 1 100px"><input name="k" type="number" min="0" placeholder="kcal each" required><button class="btn">Add</button></form>
  <div class="row"><div class="g">Today: <b>${kc}</b> of ${S.goal} kcal</div><form data-f="goal" style="margin:0;flex-wrap:nowrap"><input name="g" type="number" min="1" value="${S.goal}" style="width:90px;flex:none" aria-label="Daily calorie goal"><button class="ghost">Set goal</button></form></div><div class="bar"><div style="width:${p}%"></div></div>`+
  (l.length?l.map(f=>`<div class="row"><div class="g">${esc(f.n)}${f.amt&&f.amt!==1?` <span class="mut">${f.amt} × ${f.each} kcal</span>`:""}</div><b>${f.kcal} kcal</b><button class="ghost" data-a="del" data-k="food" data-i="${f.id}">Delete</button></div>`).join(""):empty("Nothing logged today."));
},
File(){const fo=S.folders.filter(f=>(f.parent||null)===cwd),fl=S.files.filter(f=>(f.folder||null)===cwd),pa=[];for(let c=cwd;c;){const f=S.folders.find(x=>x.id===c);if(!f)break;pa.unshift(f);c=f.parent||null}
  const mv=f=>`<select data-a="mv" data-i="${f.id}" style="flex:0 1 120px"><option value="">Move to...</option><option value="home">Home</option>${S.folders.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>`;
  return `<div class="row"><div class="g"><button class="ghost" data-a="cd" data-i="0">Home</button>${pa.map(f=>` / <button class="ghost" data-a="cd" data-i="${f.id}">${esc(f.name)}</button>`).join("")}</div></div><form data-f="folder"><input name="n" placeholder="New folder name" required><button class="btn">Add folder</button><label class="btn" style="cursor:pointer">Upload PDF<input id="fup" type="file" accept="application/pdf" multiple hidden></label></form>`+(fo.length||fl.length?fo.map(f=>`<div class="row"><div class="g"><button class="ghost" data-a="cd" data-i="${f.id}">Folder: ${esc(f.name)}</button></div><button class="ghost" data-a="del" data-k="folders" data-i="${f.id}">Delete</button></div>`).join("")+fl.map(f=>`<div class="row"><div class="g"><b>${esc(f.name)}</b> <span class="mut">${(f.size/1048576).toFixed(1)} MB</span></div>${mv(f)}<button class="ghost" data-a="open" data-i="${f.id}">Open</button><button class="ghost" data-a="dl" data-i="${f.id}">Download</button><button class="ghost" data-a="del" data-k="files" data-i="${f.id}">Delete</button></div>`).join(""):empty("This folder is empty. Add a folder or upload a PDF."))},
Project(){if(openP&&pj(openP))return projDetail();
  return `<form data-f="proj"><input name="r" placeholder="owner/repo or GitHub link" required style="flex:3 1 220px"><input name="n" placeholder="Display name (optional)"><button class="btn">Add repo</button></form>`+
  (S.projects.length?`<div class="grid">${S.projects.map(p=>`<div class="pc"><a href="${esc(p.url)}" target="_blank" rel="noopener"><div class="th">${thumb(p)}</div><div class="pb"><b>${esc(p.title)}</b><span class="mut">${esc(p.owner)}/${esc(p.name)}</span></div></a><div class="pa"><button class="ghost" data-a="ptask" data-i="${p.id}">Tasks (${S.tasks.filter(t=>t.pid===p.id).length})</button><button class="ghost" data-a="pic" data-i="${p.id}">Edit thumbnail</button>${p.img?`<button class="ghost" data-a="nopic" data-i="${p.id}">Reset</button>`:""}<button class="ghost" data-a="del" data-k="projects" data-i="${p.id}">Remove</button></div></div>`).join("")}</div>`:empty("Add a GitHub repo to open it from here."));
}};

function render(enter){
  $("#nav").innerHTML=`<div class="brand">Leslie <b>Project</b> Dashboard<span>Your local workspace</span></div>`+TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-tab="${t[0]}"><em>${t[1]}</em>${t[0]}</button>`).join("");
  $("#view").innerHTML=(tab==="Dashboard"?"":`<h2 class="pt">${tab}</h2>`)+V[tab]();
  const imp=$("#imp");if(imp)imp.onchange=e=>{const r=new FileReader();r.onload=()=>{try{Object.assign(S,merge(S,JSON.parse(r.result)));COLS.forEach(k=>S[k].forEach(it=>{if(!it.u)it.u=1}));rebuild();save();render()}catch(x){alert("That file is not a valid backup.")}};r.readAsText(e.target.files[0])};
  const fu=$("#fup");if(fu)fu.onchange=upload;
  if(enter)document.querySelectorAll("#view .hero,#view .st,#view .card,#view .row,#view .pc,#view form,#view .pt,#view .cal").forEach((el,i)=>el.style.animation=`up .55s ${Math.min(i,14)*45}ms cubic-bezier(.2,.8,.2,1) both`);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab],[data-a]");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;openP=null;try{location.hash=tab}catch(x){}scrollTo(0,0);return render(true)}
  const a=b.dataset.a,i=parseFloat(b.dataset.i),k=b.dataset.k;
  if(a==="tg"){const t=S.tasks.find(t=>t.id===i);t.done=!t.done}
  else if(a==="del"){if(k==="folders"&&(S.folders.some(f=>f.parent===i)||S.files.some(f=>f.folder===i)))return alert("Folder is not empty.");if(k==="files"){const f=S.files.find(x=>x.id===i);fdel(String(i));if(f&&f.gh)ghDel(ghp(f)).catch(()=>{})}S[k]=S[k].filter(x=>x.id!==i)}
  else if(a==="day"){sel=k}
  else if(a==="goto"){sel=k;const d=new Date(k+"T00:00");cm=new Date(d.getFullYear(),d.getMonth(),1);tab="Calendar";try{location.hash=tab}catch(x){}scrollTo(0,0);return render(true)}
  else if(a==="mo"){cm.setMonth(cm.getMonth()+ +k)}
  else if(a==="ptask"){openP=i}else if(a==="pback"){openP=null}else if(a==="cd"){cwd=i||null}else if(a==="open"){openPdf(i);return}else if(a==="sync"){sync(true);return}else if(a==="ghoff"){localStorage.removeItem("lpd-gh");SS="Not connected"}else if(a==="dl"){dlPdf(i);return}
  
  else if(a==="pic"){picFor=i;return $("#pic").click()}
  else if(a==="nopic"){S.projects.find(p=>p.id===i).img=""}
  else if(a==="exp"){if(window.AndroidApp){AndroidApp.share("leslie-dashboard-backup.json",JSON.stringify(S));return}const l=document.createElement("a");l.href="data:application/json,"+encodeURIComponent(JSON.stringify(S));l.download="leslie-dashboard-backup.json";l.click();return}
  save();render();
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),t=f.dataset.f;
  if(t==="gh")return ghConnect(v);
  if(t==="task")S.tasks.push({id:id(),t:v.t,due:v.d,done:false,pid:v.p?parseFloat(v.p):undefined});
  if(t==="folder")S.folders.push({id:id(),name:v.n,parent:cwd});
  if(t==="event")S.events.push({id:id(),t:v.t,date:v.d,time:v.tm||"",allday:!!v.ad});
  if(t==="money")S.money.push({id:id(),type:v.ty,n:v.n,amt:parseFloat(v.a),date:today});
  if(t==="food"){const q=parseFloat(v.q)||1,e=parseInt(v.k)||0;S.food.push({id:id(),n:v.n,each:e,amt:q,kcal:Math.round(e*q),date:today})}
  if(t==="goal"){const g=parseInt(v.g);if(g>0)S.goal=g}
  if(t==="cal"){if(v.ty==="task")S.tasks.push({id:id(),t:v.t,due:sel,done:false});else S.events.push({id:id(),t:v.t,date:sel,time:v.tm||"",allday:!!v.ad})}
  if(t==="proj"){const r=repoInfo(v.r);if(!r)return alert("Use owner/repo or a github.com link.");S.projects.push({id:id(),title:v.n||r.name,...r,img:""})}
  save();render();
});
$("#pic").addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const img=new Image();img.onload=()=>{
    const c=document.createElement("canvas");c.width=480;c.height=270;const x=c.getContext("2d");
    const s=Math.max(480/img.width,270/img.height),w=img.width*s,h=img.height*s;
    x.drawImage(img,(480-w)/2,(270-h)/2,w,h);
    S.projects.find(p=>p.id===picFor).img=c.toDataURL("image/jpeg",.75);save();render();URL.revokeObjectURL(img.src)};
  img.src=URL.createObjectURL(file);e.target.value="";
});
document.addEventListener("change",e=>{const t=e.target;if(t.name==="ad"&&t.form&&t.form.tm){t.form.tm.disabled=t.checked;if(t.checked)t.form.tm.value=""}if(t.name==="nd"&&t.form)t.form.d.disabled=t.checked;if(t.dataset&&t.dataset.a==="mv"&&t.value){const f=S.files.find(x=>x.id===parseFloat(t.dataset.i));if(f){f.folder=t.value==="home"?null:parseFloat(t.value);save();render()}}});
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1));if(NAMES.includes(h)&&h!==tab){tab=h;render(true)}});
render(true);
(()=>{const c=$("#bg"),x=c.getContext("2d");let W,H;
const B=[[.5,.11,.17,0,1.3,"225,29,46",.55],[.6,.13,.09,2,4,"140,0,20",.6],[.4,.17,.14,4,.7,"255,71,87",.38],[.55,.09,.19,1,3,"90,0,10",.7],[.45,.15,.12,5,2.2,"190,10,30",.45]];
const size=()=>{W=c.width=Math.max(64,Math.ceil(innerWidth/5));H=c.height=Math.max(64,Math.ceil(innerHeight/5))};
function draw(ms){const t=ms/1000;x.globalCompositeOperation="source-over";x.fillStyle="#060001";x.fillRect(0,0,W,H);x.globalCompositeOperation="lighter";
for(const[r,a,b,p,q,col,o]of B){const px=W*(.5+.4*Math.sin(t*a+p)+.18*Math.sin(t*a*2.3+p*1.7)),py=H*(.5+.4*Math.sin(t*b+q)+.18*Math.sin(t*b*1.9+q*2.1)),R=Math.max(W,H)*r,g=x.createRadialGradient(px,py,0,px,py,R);g.addColorStop(0,`rgba(${col},${o})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.fillRect(0,0,W,H)}}
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
const loop=ms=>{draw(ms);requestAnimationFrame(loop)};
size();addEventListener("resize",()=>{size();draw(performance.now())});
still?draw(0):requestAnimationFrame(loop)})();
if(NAT&&NAT.onChange)NAT.onChange(()=>sync());window.flushNow=()=>{clearTimeout(pt);return sync()};document.addEventListener("visibilitychange",()=>{if(document.hidden)flushNow();else sync()});addEventListener("pagehide",()=>{flushNow()});if(NAT&&NAT.onFlush)NAT.onFlush(async()=>{await flushNow();NAT.flushed()});setInterval(()=>{if(!document.hidden&&GH())sync()},60000);boot();
</script>
